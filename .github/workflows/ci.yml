name: CI/CD — Habit Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Tests & qualité du code
  # ─────────────────────────────────────────
  test:
    name: Tests PHP
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: habit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, pdo_mysql, openssl, fileinfo, zip, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copie du .env de test
        run: cp .env.example .env.testing

      - name: Configuration de l'environnement de test
        run: |
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=habit_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env.testing

      - name: Génération de la clé d'application
        run: php artisan key:generate --env=testing

      - name: Migrations de test
        run: php artisan migrate --env=testing --force

      - name: Lancement des tests
        run: php artisan test --env=testing

  # ─────────────────────────────────────────
  # JOB 2 : Déploiement automatique
  # (uniquement sur push vers main)
  # ─────────────────────────────────────────
  deploy:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Jamais deux interventions SSH en même temps sur le serveur (voir rotate-secrets.yml)
    concurrency:
      group: production-ssh
      cancel-in-progress: false

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/u526846542/domains/dri-vale.org/public_html
            php artisan down --retry=10
            # Bascule vers public/ (une seule fois) : l'ancien .htaccess racine non versionné
            # bloquerait le git pull qui apporte le .htaccess versionné, et deploy.php sort du web.
            if [ -f .htaccess ] && ! git ls-files --error-unmatch .htaccess >/dev/null 2>&1; then
              mv .htaccess .htaccess.avant-public.bak
            fi
            if [ -f deploy.php ]; then
              mv deploy.php ../deploy.php.desactive
            fi
            # Ancien webhook de déploiement (remplacé par ce job SSH) : il lançait db:seed --force
            if [ -f public/deploy.php ]; then
              mv public/deploy.php ../deploy-public.php.desactive
            fi
            # Copie de secours de vendor/ : si composer échoue, retour au commit précédent
            # au lieu de laisser l'API avec des dépendances à moitié installées.
            PREV=$(git rev-parse HEAD)
            rm -rf ../vendor.avant-deploy
            if [ -d vendor ]; then cp -a vendor ../vendor.avant-deploy; fi
            git pull origin main || { [ ! -f .htaccess ] && [ -f .htaccess.avant-public.bak ] && mv .htaccess.avant-public.bak .htaccess; }
            if ! HOME=/home/u526846542 composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev; then
              echo "ECHEC de composer install : retour au commit $PREV"
              git reset --hard "$PREV"
              rm -rf vendor
              if [ -d ../vendor.avant-deploy ]; then mv ../vendor.avant-deploy vendor; fi
              php artisan up
              exit 1
            fi
            rm -rf ../vendor.avant-deploy
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
